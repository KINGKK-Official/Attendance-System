version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://:attendance_redis_pass@redis:6379/0
    volumes:
      - ./backend:/app/backend
      - ./attendance_mvp.db:/app/attendance_mvp.db
    depends_on:
      - redis
      - kafka

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-attendance_redis_pass} --appendonly no

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  cv_tier1_worker:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    command: python -m backend.workers.cv_tier1_worker
    env_file:
      - backend/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://:attendance_redis_pass@redis:6379/0
    volumes:
      - ./backend:/app/backend
      - ./attendance_mvp.db:/app/attendance_mvp.db
    depends_on:
      - kafka
      - redis

  cv_tier2_worker:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    command: python -m backend.workers.cv_tier2_worker
    env_file:
      - backend/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://:attendance_redis_pass@redis:6379/0
    volumes:
      - ./backend:/app/backend
      - ./attendance_mvp.db:/app/attendance_mvp.db
    depends_on:
      - kafka
      - redis

  analyzer_worker:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    command: python -m backend.workers.analyzer_worker
    env_file:
      - backend/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://:attendance_redis_pass@redis:6379/0
    volumes:
      - ./backend:/app/backend
      - ./attendance_mvp.db:/app/attendance_mvp.db
    depends_on:
      - kafka
      - redis
